<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make Your Own Advice Tab</title>
  <meta name="description" content="Get your own link where people can send you questions by email. Free, no sign-up here.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Make your own ✨</h1>
      <p class="lede">Get a link like this one for your LinkedIn or bio. Messages go straight to your email. It's free and takes about a minute.</p>
    </header>

    <ol class="steps">
      <li>Get a free access key at <a href="https://web3forms.com" target="_blank" rel="noopener">web3forms.com</a>. Enter your email and they'll send you one.</li>
      <li>Paste the key and your name below.</li>
    </ol>

    <form id="make-form" novalidate>
      <label>Your first name
        <input name="name" type="text" autocomplete="given-name" required maxlength="60" placeholder="Sam">
      </label>

      <label>Your Web3Forms access key
        <input name="key" type="text" autocomplete="off" spellcheck="false" required
               pattern="[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
               placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
      </label>

      <button type="submit">Make my link</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <div id="result">
      <label>Your link
        <input id="link" type="text" readonly>
      </label>
      <div class="actions">
        <button type="button" id="copy">Copy link</button>
        <a id="open" class="button secondary" href="#" target="_blank" rel="noopener">Try it out</a>
      </div>
    </div>

    <p class="make-own"><a href="./">← Back</a></p>
  </main>

  <script src="make.js"></script>
</body>
</html>
