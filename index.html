<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reachouts</title>
  <meta name="description" content="Send a question or a note straight to my inbox.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <!-- Someone's personal page: ?u=<handle> -->
    <section id="tab" hidden>
      <header>
        <h1 id="heading">Hey there 👋</h1>
        <p class="headline" id="headline" hidden></p>
        <p class="lede" id="lede">Got a question, want some advice, or just want to say hi? Drop me a note. I read every one and write back.</p>
      </header>

      <form id="reach-form" novalidate>
        <div class="starters" role="group" aria-label="Ideas to get you started">
          <button type="button" data-starter="I'd love your advice on ">💡 Ask for advice</button>
          <button type="button" data-starter="Hi! I just wanted to say ">👋 Just saying hi</button>
          <button type="button" data-starter="I came across something you might like: ">✨ Share something cool</button>
        </div>

        <!-- The postcard: airmail edge, stamp, a "From" line and lined paper to write on -->
        <div class="postcard" id="postcard">
          <div class="paper">
            <div class="postcard-top">
              <p class="to">To <strong id="to-name">you</strong></p>
              <div class="stamp" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </div>
              <svg class="postmark" viewBox="0 0 60 24" aria-hidden="true"><path d="M0 4q7.5-4 15 0t15 0 15 0 15 0M0 12q7.5-4 15 0t15 0 15 0 15 0M0 20q7.5-4 15 0t15 0 15 0 15 0"/></svg>
            </div>

            <label class="from">From <span class="optional">your email, so I can reply</span>
              <input name="email" type="email" autocomplete="email" required maxlength="200" placeholder="you@example.com">
            </label>

            <label class="note">What's on your mind?
              <textarea name="message" rows="6" required maxlength="5000"></textarea>
            </label>
          </div>
        </div>

        <!-- Honeypot: humans never see this, bots fill it in -->
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" id="send">
          <span class="send-labels">
            <span class="label-idle">Send it my way</span>
            <span class="label-sent" aria-hidden="true">Sent <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          </span>
          <svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- No handle, or one that doesn't exist -->
    <section id="home" hidden>
      <header>
        <h1 id="home-heading">Reachouts ✨</h1>
        <p class="lede" id="home-lede">A friendly link where people can send you questions. Messages land in your inbox, and you just hit reply.</p>
      </header>
      <a class="button" href="account.html">Get your own link</a>
    </section>

    <p class="make-own" id="make-own" hidden><a href="account.html">Get your own Reachouts link →</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
