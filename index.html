<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advice Tab</title>
  <meta name="description" content="Send a reachout or a question straight to my inbox.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <header>
      <h1 id="heading">Hey there 👋</h1>
      <p class="lede" id="lede">Got a question, want some advice, or just want to say hi? Drop me a note. I read every one and write back.</p>
    </header>

    <form id="advice-form" novalidate>
      <label>Your email, so I can reply
        <input name="email" type="email" autocomplete="email" required maxlength="200" placeholder="you@example.com">
      </label>

      <label>What's on your mind?
        <textarea name="message" rows="6" required maxlength="5000" placeholder="No question is too small."></textarea>
      </label>

      <!-- Honeypot: humans never see this, bots fill it in -->
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" id="send">Send it my way</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
