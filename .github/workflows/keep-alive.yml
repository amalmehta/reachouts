# Free Supabase projects pause after about a week of low activity, which takes reachouts.me down.
# This makes one small read-only request a day so the project stays awake.
name: Keep Supabase Awake

on:
  schedule:
    - cron: "17 15 * * *" # daily
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          # Same public values as config.js.
          SUPABASE_URL: https://ykrdfabnfgsfpzcfudyq.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrcmRmYWJuZmdzZnB6Y2Z1ZHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTIwOTMsImV4cCI6MjEwNjI4ODA5M30.ragRlAhGCDZI60-pmkmrO611noQwY1C8X14Aa-7wHK8
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/public_profile" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{"h":"keep-alive"}'
